<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f6f7f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <!-- iPhone home screen: iOS only takes a PNG here, and rounds the corners itself. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Food Tracker" />
    <!-- Behind Cloudflare Access, so the manifest fetch must carry the sign-in cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <title>Food Tracker</title>
  </head>
  <body>
    <!--
      Shown until the app draws its first screen. If that hasn't happened after a while (the script
      didn't load, or the sign-in is stuck), a way out appears on its own: no script needed.
    -->
    <style>
      .boot-slow { opacity: 0; animation: boot-show 0.3s ease 10s forwards; }
      @keyframes boot-show { to { opacity: 1; } }
    </style>
    <main id="app" class="screen">
      <p class="muted">Loading…</p>
      <p class="boot-slow">This is taking longer than usual. <a href="/?r=1">Tap to reload</a>, or open food.pivotaiglobal.com in Safari to sign in again.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
