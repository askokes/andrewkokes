# Publishes the food tracker (food.pivotaiglobal.com) whenever its code is
# pushed to the working branch, or on demand from the Actions tab. Tests must
# pass first. Needs the repository secret CLOUDFLARE_API_TOKEN (the same
# Cloudflare deploy key `npm run deploy` uses); FOOD_INVITE_TOKEN is optional
# and, when set, is installed as the Worker secret ACCESS_INVITE_TOKEN and used
# to let the Apple Watch Shortcut's sync path through Access.
# Secrets never reach forks or pull requests: this runs only on pushes and
# manual runs.
name: Deploy food tracker

on:
  push:
    branches: [claude/phase-1-scaffold-deploy-rwsafu]
    paths:
      - "food-tracker/**"
      - ".github/workflows/deploy-food-tracker.yml"
  workflow_dispatch:

# One deploy at a time, in order.
concurrency:
  group: deploy-food-tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: food-tracker
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_ACCOUNT_ID: fd5ad410c0a9e058fc62e42ab827be98
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: food-tracker/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Check the deploy key is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the repository secret CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Publish (build, database migrations, Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Install the invite key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INVITE_KEY: ${{ secrets.FOOD_INVITE_TOKEN }}
        run: |
          if [ -z "$INVITE_KEY" ]; then
            echo "No FOOD_INVITE_TOKEN secret; leaving the Worker's invite key as it is."
            exit 0
          fi
          printf %s "$INVITE_KEY" | npx wrangler secret put ACCESS_INVITE_TOKEN

      # The Shortcut can't sign in, so its one path skips Access and the Worker
      # checks its sync key instead. Needs a key that may edit Access apps.
      - name: Let the Apple Watch Shortcut through Access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FOOD_INVITE_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No FOOD_INVITE_TOKEN secret; skipping. Apple Watch syncs will get the sign-in page until it's set."
            exit 0
          fi
          node scripts/watch-access.mjs

      - name: Check the live app answers
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://food.pivotaiglobal.com/icon-192.png)
          echo "icon-192.png: HTTP $code"
          [ "$code" = "200" ]
          # A sync with no key reaches the Worker (401 from the app), not Access's sign-in page (302).
          # A new Access rule takes a little while to apply, so give it a minute.
          for try in 1 2 3 4 5 6 7; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{}' https://food.pivotaiglobal.com/api/watch/sync)
            echo "watch sync without a key: HTTP $code"
            [ "$code" = "401" ] && break
            sleep 10
          done
          [ "$code" = "401" ] || echo "::warning::The Apple Watch sync path still goes to the sign-in page (HTTP $code)."

