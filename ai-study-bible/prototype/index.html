<html lang="en">
<head>

<title>AI-Assisted Study Bible</title>
<style>

    --ink: #ebe9e3; --ink-soft: #d3d1cb; --ink-2: #a3a9b3; --ink-3: #6f7681;

    --cross: #4fcdbf; --cross-soft: #123430;
    --strong: #f0b730; --solid: #9ccf5c; --light: #6b7280;
    --quote: #f291ad; --quote-soft: #3b1b27;
    --story: #bba6f5; --story-soft: #2a2444;
    --topic: #b3bdc8; --topic-soft: #252b33;
    --seg: #1d2229; --seg-on: #353b45;
    --hl: #4a3d12; --scrim: rgba(0,0,0,.55); --shadow: 0 -8px 30px rgba(0,0,0,.5);
    --json-key: #8ab8e8; --json-str: #4fcdbf; --json-num: #f0b730; --json-bool: #bba6f5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #050608; --page-2: #111318; --bezel: #22242a; --bezel-edge: #3a3d45;
  --bg: #0f1216; --surface: #171b21; --surface-2: #12161b;
  --ink: #ebe9e3; --ink-soft: #d3d1cb; --ink-2: #a3a9b3; --ink-3: #6f7681;
  --rule: #262b33; --rule-2: #3a404a;
  --accent: #8ab8e8; --accent-ink: #0b1a2a; --accent-soft: #1b2b3d;
  --cross: #4fcdbf; --cross-soft: #123430;

  --quote: #f291ad; --quote-soft: #3b1b27;

* { box-sizing: border-box; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tag { display: inline-block; font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 6px; vertical-align: middle; }

.nav-btn svg { width: 14px; height: 14px; }
.loading { padding: 40px 0; color: var(--ink-3); font-size: 14px; }
.loading .bar { height: 12px; border-radius: 6px; background: var(--rule); margin: 14px 0; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.strip { flex: none; border-top: 1px solid var(--rule); background: var(--surface-2); padding: 7px 0 8px; }
.strip-meta { display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 24px; font-size: 11.5px; color: var(--ink-3); }

.marquee { position: relative; height: 62px; margin-top: 7px; overflow: hidden; transition: opacity .14s; -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
.marquee.fading { opacity: 0; }
.marquee.hold { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.marquee.hold::-webkit-scrollbar { display: none; }

.track { display: flex; gap: 8px; padding: 0 16px; width: max-content; will-change: transform; }
.marquee.hold .track { transform: none !important; }
.chip { display: inline-flex; flex-direction: column; gap: 4px; flex: none; text-align: left; min-width: 200px; max-width: 288px; padding: 8px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--rule); color: var(--ink); scroll-snap-align: start; box-shadow: 0 1px 2px rgba(20,24,30,.05); user-select: none; -webkit-user-select: none; }
.chip .top { display: flex; align-items: center; gap: 6px; font-size: 13.5px; line-height: 20px; white-space: nowrap; min-width: 0; }
.chip .dir { color: var(--accent); font-size: 15px; width: 14px; text-align: center; flex: none; }
.chip.cross { border-color: var(--cross-soft); }
.chip.cross .dir, .chip.cross .lbl { color: var(--cross); }
.chip .lbl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.dot.strong { background: var(--strong); } .dot.solid { background: var(--solid); } .dot.light { background: var(--light); }

.rpill.quote { color: var(--quote); background: var(--quote-soft); }

.rpill.topic { color: var(--topic); background: var(--topic-soft); }
.rpill.lg { height: 26px; padding: 0 11px; font-size: 13px; }
.rpill .pct { font-variant-numeric: tabular-nums; }
.rpill .pct::before { content: "\00b7"; margin: 0 4px; opacity: .6; }
.empty { display: flex; align-items: center; height: 58px; padding: 0 2px; color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.trailbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-top: 1px solid var(--rule); background: var(--surface-2); }
.crumbs { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 13px; scrollbar-width: none; padding: 6px 4px; }
.crumbs::-webkit-scrollbar { display: none; }
.crumb { color: var(--ink-2); padding: 2px 4px; border-radius: 6px; }
.crumb.cur { color: var(--ink); font-weight: 600; background: var(--surface); border: 1px solid var(--rule); }
.crumb.fwd { opacity: .45; }
.crumbs .arrow { color: var(--ink-3); margin: 0 2px; }
.tr-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--accent); flex: none; }
.tr-btn:disabled { color: var(--rule-2); cursor: default; }
.tr-btn svg { width: 20px; height: 20px; }

.home { flex: none; height: 30px; display: grid; place-items: center; }
.home::after { content: ""; width: 134px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow); transform: translateY(105%); transition: transform .34s cubic-bezier(.2,.8,.2,1); z-index: 60; visibility: hidden; }
.sheet.on { transform: none; visibility: visible; }

.s-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 20px; flex: none; }

.passage { font-family: var(--serif); font-size: 17px; line-height: 1.62; color: var(--ink); margin: 0 0 4px; }
.passage .vn { vertical-align: super; }
.caption { font-size: 11.5px; color: var(--ink-3); margin: 0 0 14px !important; }
.votes-list { list-style: none; margin: 0 0 10px; padding: 0; border-top: 1px solid var(--rule); }

.btn { flex: 1; height: 46px; border-radius: 14px; font-size: 16px; font-weight: 600; background: var(--bg); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

.about h4 { margin: 14px 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DIR = ['out', 'in', 'both'], TIER = ['strong', 'solid', 'light'], GLYPH = { out: '\u2192', in: '\u2190', both: '\u21c4' };
const REASON = {
  quote: { label: 'Direct quote', pill: 'Quote', none: 'No direct quotes' },
  story: { label: 'Same story', pill: 'Story', none: 'No same-story links' },
  topic: { label: 'Same topic', pill: 'Topic', none: 'No same-topic links' }
};
const LEGEND = { reasonKinds: ['quote', 'story', 'topic'], reasonBases: ['sharedWording', 'quotation', 'parallelAccount', 'retelling', 'samePassage', 'sharedNames', 'theme'] };
const params = new URLSearchParams(location.search);

/* Every piece of runtime state lives here. */
const S = {
  dataRoot: (params.get('data') || './data').replace(/\/+$/, ''),
  books: [], bookByNo: {}, bookKeys: new Map(), text: null, xref: {}, legend: { ...LEGEND }, notes: { edges: {}, verses: {} }, manifest: null,
  bundles: {}, missing: [], bookNo: 0, chapter: 0, bundle: null, focusVid: 0, pinned: false, focusLockUntil: 0, scrollRaf: 0,
  motion: { defaultMode: 'hold', baseSeconds: 3.0, perWeightSeconds: 3.0 }, motionOn: false, prefersReduced: false, filter: 'all',
  ticker: { all: [], items: [], x: 0, seqW: 0, widths: [], cum: [], dwell: [], raf: 0, lastT: 0, gen: 0, holdPointer: false, drag: null, suppressClick: false, wheelAt: 0 },
  trail: null, peekItem: null, peekFocus: null, sheet: null, pickerBook: 0, jsonMode: null
};
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('asb.' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('asb.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};
const reader = $('#reader'), track = $('#track'), marquee = $('#marquee');
const nowIso = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
const pad2 = n => String(n).padStart(2, '0');

/* ---------- ids, refs, labels, snippets (derivations match the pipeline) ---------- */
const split = vid => ({ book: Math.floor(vid / 1e6), chapter: Math.floor(vid / 1000) % 1000, verse: vid % 1000 });
const vidOf = (b, c, v) => b * 1e6 + c * 1000 + v;
const bookOf = vid => { const n = Math.floor(vid / 1e6); return S.bookByNo[n] || { bookNo: n, osis: `Book${n}`, name: `Book ${n}`, short: `B${n}`, chapters: 0, verseCounts: [], testament: n <= 39 ? 'OT' : 'NT' }; };
function refOf(start, end) {
  const a = split(start); let s = `${bookOf(start).osis}.${a.chapter}.${a.verse}`;
  if (end !== start) { const b = split(end); s += `-${bookOf(end).osis}.${b.chapter}.${b.verse}`; }
  return s;
}
function labelOf(start, end) {
  const a = split(start), s = `${bookOf(start).name} ${a.chapter}:${a.verse}`;
  if (end === start) return s;
  const b = split(end);
  if (a.book !== b.book) return `${s}\u2013${bookOf(end).name} ${b.chapter}:${b.verse}`;
  if (a.chapter !== b.chapter) return `${s}\u2013${b.chapter}:${b.verse}`;
  return `${s}\u2013${b.verse}`;
}
function verseText(vid) {
  const p = split(vid), b = S.text && S.text.books[p.book - 1];
  const ch = b && b[p.chapter - 1];
  const t = ch ? ch[p.verse - 1] : undefined; return typeof t === 'string' ? t : undefined;
}
const hasChapter = (bookNo, chapter) => { const b = S.text && S.text.books[bookNo - 1], ch = b && b[chapter - 1]; return !!(Array.isArray(ch) && ch.length && ch.every(t => typeof t === 'string')); };
function nextVid(vid) {
  const p = split(vid), book = S.bookByNo[p.book];
  if (!book) return null;
  if (p.verse < book.verseCounts[p.chapter - 1]) return vid + 1;
  if (p.chapter < book.chapters) return vidOf(p.book, p.chapter + 1, 1);
  return p.book < 66 ? vidOf(p.book + 1, 1, 1) : null;
}
function rangeVids(start, end, cap = 400) {
  const out = []; let v = start;
  while (v !== null && v <= end && out.length < cap) { out.push(v); v = nextVid(v); }
  return out;
}
function snippetOf(start, end) {
  const max = (S.text && S.text.snippetMaxChars) || 110;
  let t = '';
  for (const v of rangeVids(start, end)) { t = verseText(v) || ''; if (t) break; }
  if (t.length <= max) return t;
  let c = t.slice(0, max); const i = c.lastIndexOf(' ');
  if (i > 0) c = c.slice(0, i);
  return c.replace(/[,;:]+$/, '') + '\u2026';
}
function reasonOf(r) {
  if (!Array.isArray(r)) return null;
  const kind = S.legend.reasonKinds[r[0]] || 'topic';
  return { kind, label: (REASON[kind] || REASON.topic).label, because: r[3] || '', basis: S.legend.reasonBases[r[1]] || null, confidence: r[2], source: 'rule' };
}
function expandChip(focusVid, raw, rank) {
  const [start, end, dir, votesOut, votesIn, score, weight, tier, via, r] = raw;
  const why = S.notes.edges[`${focusVid}>${start}${end !== start ? '-' + end : ''}`] || null;
  return {
    rank, to: { start, end, ref: refOf(start, end), label: labelOf(start, end) }, direction: DIR[dir], votesOut, votesIn, score, weight,
    tier: TIER[tier], sameBook: Math.floor(start / 1e6) === Math.floor(focusVid / 1e6),
    viaRange: via ? { start: via[0], end: via[1], label: labelOf(via[0], via[1]), span: via[2] } : null,
    snippet: snippetOf(start, end), reason: reasonOf(r), why, aiStatus: why ? 'cached' : 'not_generated'
  };
}

/* ---------- data loading ---------- */
async function fetchJson(path, optional) {
  const url = `${S.dataRoot}/${path}`;
  try { const r = await fetch(url); if (!r.ok) throw new Error(`HTTP ${r.status}`); return await r.json(); }
  catch (e) { S.missing.push(url); if (optional) return null; throw new Error(`${url}: ${e.message}`); }
}
async function loadXref(bookNo) {
  if (S.xref[bookNo]) return S.xref[bookNo];
  const b = S.bookByNo[bookNo];
  const x = await fetchJson(`xref/${pad2(bookNo)}-${b.osis}.json`, true);
  if (!x) console.warn(`No cross reference shard for ${b.name}; the strip will be empty for this book.`);
  if (x && x.legend) { if (Array.isArray(x.legend.reasonKinds)) S.legend.reasonKinds = x.legend.reasonKinds; if (Array.isArray(x.legend.reasonBases)) S.legend.reasonBases = x.legend.reasonBases; }
  S.xref[bookNo] = x || { chapters: [] };
  return S.xref[bookNo];
}
function attribution() {
  const m = S.manifest, src = (m && m.sources) || [];
  const by = kind => (src.find(s => s.kind === kind) || {}).attribution;
  return {
    text: by('text') || 'Berean Standard Bible, public domain',
    crossReferences: by('crossReferences') || 'Cross references from OpenBible.info, CC-BY (2016-02-01)',
    ai: by('ai') || "Study notes marked 'why' are AI-generated (see manifest.sources.ai)"
  };
}
function neighbourChapter(bookNo, chapter, dir) {
  const b = S.bookByNo[bookNo]; let c = chapter + dir, n = bookNo;
  if (c < 1) { n = bookNo - 1; if (!S.bookByNo[n]) return null; c = S.bookByNo[n].chapters; }
  else if (c > b.chapters) { n = bookNo + 1; if (!S.bookByNo[n]) return null; c = 1; }
  return vidOf(n, c, 0);
}
async function buildBundle(bookNo, chapter) {
  const chapterId = vidOf(bookNo, chapter, 0);
  if (S.bundles[chapterId]) return S.bundles[chapterId];
  const book = S.bookByNo[bookNo], x = await loadXref(bookNo);
  const texts = S.text.books[bookNo - 1][chapter - 1], xch = x.chapters[chapter - 1] || [];
  const tickerInline = (S.manifest && S.manifest.ranking && S.manifest.ranking.tickerInline) || 12;
  const verses = texts.map((text, i) => {
    const vid = vidOf(bookNo, chapter, i + 1), row = xch[i] || [[0, 0, 0, 0, 0], []];
    const [out, inn, inDirect, inViaRange, unique] = row[0], ticker = row[1].map((raw, r) => expandChip(vid, raw, r + 1));
    return {
      vid, verse: i + 1, ref: `${book.osis}.${chapter}.${i + 1}`, label: `${book.name} ${chapter}:${i + 1}`, text, omitted: text === '', paragraphStart: i === 0,
      counts: { out, in: inn, inDirect, inViaRange, unique, shown: ticker.length, more: unique - ticker.length }, ticker,
      connections: `connections/${vid}.json`, ai: { verse: `ai:verse:${vid}:bsb:bsb-2023:v3`, status: S.notes.verses[vid] ? 'cached' : 'not_generated' }
    };
  });
  const bundle = {
    schema: 'asb.chapter/2', datasetVersion: x.datasetVersion || (S.manifest && S.manifest.datasetVersion) || '2026.09.1', rankingVersion: x.rankingVersion || 'asb.rank.v2',
    translation: S.text.translation, book: { bookNo, osis: book.osis, name: book.name, short: book.short }, chapter, chapterId, verseCount: verses.length,
    prevChapter: neighbourChapter(bookNo, chapter, -1), nextChapter: neighbourChapter(bookNo, chapter, 1), headings: [], tickerInline, verses, attribution: attribution()
  };
  S.bundles[chapterId] = bundle;
  return bundle;
}

/* ---------- reference search ---------- */
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
function findBook(s) {
  const k = norm(s); if (!k) return null;
  if (S.bookKeys.has(k)) return S.bookByNo[S.bookKeys.get(k)];
  return S.books.find(b => norm(b.name).startsWith(k)) || S.books.find(b => (b.aliases || []).some(a => norm(a).startsWith(k))) || null;
}
function parseRef(q) {
  const m = String(q || '').trim().replace(/\./g, ' ').match(/^(\d?\s*[a-z][a-z ]*?)\s*(\d+)(?:\s*[:\s]\s*(\d+))?$/i);
  if (!m) return null;
  const book = findBook(m[1]); if (!book) return null;
  const chapter = +m[2]; if (chapter < 1 || chapter > book.chapters) return null;
  const verse = m[3] ? +m[3] : null; if (verse !== null && (verse < 1 || verse > book.verseCounts[chapter - 1])) return null;
  return { bookNo: book.bookNo, chapter, verse, label: `${book.name} ${chapter}${verse ? ':' + verse : ''}` };
}

/* ---------- trail (spec 4.3 shape) ---------- */
function newTrail() {
  return {
    schema: 'asb.trail/2', id: `trail_${nowIso()}_${Math.random().toString(16).slice(2, 6)}`, translation: 'bsb', cursor: -1, hops: [], forward: [], peeks: [], peek: null,
    web: { nodes: [], edges: [], peekOnlyEdges: [], booksTouched: [], loopClosed: false },
    rules: { pushOn: ['open', 'jump', 'search', 'bookmarkOpen'], notPushed: ['scroll', 'peek', 'back', 'forward'], scrollUpdatesCurrentHop: true, maxHops: 200, persist: 'in memory for this prototype; SwiftData on device' }
  };
}
function hopFor(kind, vid, via, highlight) {
  const p = split(vid), book = S.bookByNo[p.book];
  return { index: 0, kind, vid, ref: `${book.osis}.${p.chapter}.${p.verse}`, label: `${book.name} ${p.chapter}:${p.verse}`, book: book.name, via, scroll: { chapter: vidOf(p.book, p.chapter, 0), anchor: vid, highlight }, at: nowIso() };
}
function pushHop(kind, vid, via = null, highlight = null) {
  const T = S.trail; T.forward = [];
  T.hops.push(hopFor(kind, vid, via, highlight));
  if (T.hops.length > T.rules.maxHops) T.hops.shift();
  T.hops.forEach((h, i) => { h.index = i; }); T.cursor = T.hops.length - 1;
  if (via) { const e = [via.from.vid, via.to.start, via.votesOut || via.votesIn]; if (!T.web.edges.some(x => x[0] === e[0] && x[1] === e[1])) T.web.edges.push(e); }
  recomputeWeb();
}
function recomputeWeb() {
  const T = S.trail, nodes = [];
  T.hops.concat(T.forward).forEach(h => { if (!nodes.includes(h.vid)) nodes.push(h.vid); });
  T.web.nodes = nodes;
  T.web.booksTouched = nodes.map(v => bookOf(v).name).filter((n, i, a) => a.indexOf(n) === i);
  T.web.loopClosed = T.web.edges.concat(T.web.peekOnlyEdges).some(e => nodes.indexOf(e[1]) >= 0 && nodes.indexOf(e[1]) < nodes.indexOf(e[0]));
}
function currentHop() { const T = S.trail; return T.hops[T.cursor] || null; }

/* ---------- rendering the reader ---------- */
function verseOf(vid) { return S.bundle && S.bundle.chapterId === vid - (vid % 1000) ? S.bundle.verses[(vid % 1000) - 1] : null; }
function renderChapter(bundle) {
  S.bundle = bundle; S.bookNo = bundle.book.bookNo; S.chapter = bundle.chapter;
  $('#titleText').textContent = `${bundle.book.name} ${bundle.chapter}`;
  const nav = id => { if (!id) return ''; const p = split(id), b = S.bookByNo[p.book]; return `${b.name} ${p.chapter}`; };
  const prev = bundle.prevChapter, next = bundle.nextChapter;
  let html = `<div class="chapter-head"><div class="book">${esc(bundle.book.name)}</div><div class="num-big num">${bundle.chapter}</div></div>`;
  for (const v of bundle.verses) {

  if (!nodes.length) s += `<text x="${cx}" y="${cy}" text-anchor="middle" fill="var(--ink-3)" font-size="14">Nothing visited yet</text>`;
  $('#webSvg').innerHTML = s;
  const hops = T.hops.length + T.forward.length;
  $('#webSub').innerHTML = `<span class="num">${hops}</span> hop${hops === 1 ? '' : 's'} \u00b7 ${T.web.nodes.length} verse${T.web.nodes.length === 1 ? '' : 's'} \u00b7 ${T.web.booksTouched.length} book${T.web.booksTouched.length === 1 ? '' : 's'}${T.web.loopClosed ? ' \u00b7 loop closed' : ''} \u00b7 ${T.peeks.length} peek${T.peeks.length === 1 ? '' : 's'}`;
}
function openWeb() { renderWeb(); $('#webOverlay').classList.add('on'); }
function closeWeb() { $('#webOverlay').classList.remove('on'); }

/* ---------- toast, search, layout ---------- */
let toastTimer = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); }
function showSearch(on) { const row = $('#searchRow'); row.hidden = !on; if (on) { const i = $('#searchInput'); i.value = ''; i.focus(); } }
async function runSearch(q) {
  const r = parseRef(q);
  if (!r) { toast(`Could not read "${q}". Try Rom 5:8 or John 3.`); return false; }
  showSearch(false);
  return navigate({ bookNo: r.bookNo, chapter: r.chapter, vid: vidOf(r.bookNo, r.chapter, r.verse || 1), kind: 'search' });
}
function fit() {
  const phone = $('#phone');
  if (innerWidth <= 500) phone.style.removeProperty('--scale');
  else phone.style.setProperty('--scale', Math.min(1, (innerHeight - 44) / 880, (innerWidth - 44) / 420).toFixed(3));
  phone.style.setProperty('--focus-y', `${Math.round(reader.clientHeight / 3)}px`);
  phone.style.setProperty('--reader-h', `${reader.clientHeight}px`);
}

/* ---------- events ---------- */
reader.addEventListener('scroll', () => { if (!S.scrollRaf) S.scrollRaf = requestAnimationFrame(onScroll); }, { passive: true });
reader.addEventListener('click', e => {
  const nav = e.target.closest('.nav-btn'); if (nav) { const p = split(+nav.dataset.chapter); navigate({ bookNo: p.book, chapter: p.chapter, vid: vidOf(p.book, p.chapter, 1), kind: 'open' }); return; }
  const v = e.target.closest('.v'); if (v) setFocus(+v.dataset.vid, { pin: true, force: true });
});
track.addEventListener('click', e => { if (S.ticker.suppressClick) return; const c = e.target.closest('.chip'); if (c) openPeek(S.ticker.all[+c.dataset.rank - 1]); });
$('#listBody').addEventListener('click', e => { const c = e.target.closest('.chip'); const f = verseOf(S.focusVid); if (c && f) openPeek(f.ticker[+c.dataset.rank - 1]); });
marquee.addEventListener('pointerdown', e => {
  S.ticker.holdPointer = true;
  if (e.pointerType === 'mouse' && marquee.classList.contains('hold')) S.ticker.drag = { x: e.clientX, left: marquee.scrollLeft, moved: false };
});
addEventListener('pointermove', e => {
  const d = S.ticker.drag; if (!d) return;
  const dx = e.clientX - d.x;
  if (!d.moved && Math.abs(dx) > 5) { d.moved = true; marquee.classList.add('dragging'); }
  if (d.moved) marquee.scrollLeft = d.left - dx;
});
addEventListener('pointerup', () => {
  const d = S.ticker.drag; S.ticker.drag = null; S.ticker.holdPointer = false;
  if (d && d.moved) { marquee.classList.remove('dragging'); S.ticker.suppressClick = true; setTimeout(() => { S.ticker.suppressClick = false; }, 0); }
});
['pointercancel', 'pointerleave'].forEach(t => marquee.addEventListener(t, () => { if (!S.ticker.drag) S.ticker.holdPointer = false; }));
marquee.addEventListener('wheel', e => {
  if (!marquee.classList.contains('hold') || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  e.preventDefault();
  const now = performance.now(); if (now - S.ticker.wheelAt < 280) return;
  S.ticker.wheelAt = now; stepChips(Math.sign(e.deltaY));
}, { passive: false });
$('#filters').addEventListener('click', e => { const b = e.target.closest('button[data-filter]'); if (b) setFilter(b.dataset.filter); });
$('#motionToggle').addEventListener('click', () => setMotion(!S.motionOn, true));
$('#backBtn').addEventListener('click', goBack);
$('#fwdBtn').addEventListener('click', goForward);
$('#crumbs').addEventListener('click', e => { const c = e.target.closest('.crumb'); if (c) goToHop(+c.dataset.hop); });
$('#webBtn').addEventListener('click', openWeb);
$('#webClose').addEventListener('click', closeWeb);
$('#copyTrail').addEventListener('click', () => copyText(JSON.stringify(S.trail, null, 2)));
$('#viewTrail').addEventListener('click', () => openJson('Trail JSON', S.trail, 'trail'));
$('#jsonCopy').addEventListener('click', () => copyText($('#jsonTa').value));
$('#jsonBtn').addEventListener('click', () => { const v = verseOf(S.focusVid); if (v) openJson(`${v.label} \u00b7 verse JSON`, v, 'verse'); });
$('#peekGo').addEventListener('click', () => { if (S.peekItem) goToChip(S.peekItem); });
$('#peekAll').addEventListener('click', () => { if (S.peekFocus) openList(S.peekFocus); });
$('#peekJson').addEventListener('click', () => { if (S.peekFocus) openJson(`${S.peekFocus.label} \u00b7 verse JSON`, S.peekFocus, 'verse'); });
$('#aboutBtn').addEventListener('click', openAbout);
$('#titleBtn').addEventListener('click', () => openPicker(0));
$('#pickerBack').addEventListener('click', () => openPicker(0));
$('#pickerBody').addEventListener('click', async e => {
  const b = e.target.closest('[data-book]'); if (b) { openPicker(+b.dataset.book); return; }
  const c = e.target.closest('[data-ch]'); if (c) { const ok = await navigate({ bookNo: S.pickerBook, chapter: +c.dataset.ch, vid: vidOf(S.pickerBook, +c.dataset.ch, 1), kind: 'open' }); if (ok) closeSheet(); }
});
$('#searchBtn').addEventListener('click', () => showSearch(true));
$('#searchCancel').addEventListener('click', () => showSearch(false));
$('#searchRow').addEventListener('submit', e => { e.preventDefault(); runSearch($('#searchInput').value); });
$('#scrim').addEventListener('click', closeSheet);
$$('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.sheet) closeSheet(); else if ($('#webOverlay').classList.contains('on')) closeWeb(); else if (!$('#searchRow').hidden) showSearch(false); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) S.ticker.lastT = 0; });
addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); if (S.focusVid) scrollToVerse(S.focusVid); });
const reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');
reducedQuery.addEventListener('change', e => { S.prefersReduced = e.matches; if (e.matches && S.motionOn) setMotion(false, false); });

/* ---------- boot ---------- */
async function boot() {
  applyTheme(store.get('theme'));
  S.prefersReduced = reducedQuery.matches;
  S.trail = newTrail(); fit();
  try {
    const [books, text, manifest, notes] = await Promise.all([fetchJson('books.json'), fetchJson('text/bsb.json'), fetchJson('manifest.json', true), fetchJson('ai/notes.json', true)]);
    S.books = books.books; S.text = text; S.manifest = manifest;
    if (notes) S.notes = { edges: notes.edges || {}, verses: notes.verses || {} };
    S.books.forEach(b => { S.bookByNo[b.bookNo] = b; [b.name, b.short, b.osis, b.sourceName].concat(b.aliases || []).forEach(k => { if (k) S.bookKeys.set(norm(k), b.bookNo); }); });
    const mo = manifest && manifest.ranking && manifest.ranking.motion;
    const f = !mo && manifest && manifest.ranking && String(manifest.ranking.dwellSeconds || '').match(/([\d.]+)\s*\+\s*([\d.]+)\s*\*\s*weight/);
    if (mo && isFinite(mo.baseSeconds) && isFinite(mo.perWeightSeconds)) S.motion = { defaultMode: mo.defaultMode || 'hold', baseSeconds: +mo.baseSeconds, perWeightSeconds: +mo.perWeightSeconds };
    else if (f) S.motion = { defaultMode: 'hold', baseSeconds: +f[1], perWeightSeconds: +f[2] };
    if (text.translation && text.translation.abbr) $('#previewTag').textContent = `${text.translation.abbr} preview`;
  } catch (e) {
    reader.innerHTML = `<div class="loading"><p>The Bible data could not be loaded.</p><p class="fine">${esc(e.message)}</p></div>`;
    console.warn(e); return;
  }
  const saved = store.get('motion.v2');
  S.motionOn = S.prefersReduced ? false : saved === null ? S.motion.defaultMode === 'autoScroll' : saved === true;
  $('#motionToggle').setAttribute('aria-checked', String(S.motionOn));
  const hash = decodeURIComponent(location.hash.slice(1)), fromHash = hash ? parseRef(hash) : null;
  let target = fromHash ? vidOf(fromHash.bookNo, fromHash.chapter, fromHash.verse || 1) : 43003016;
  if (!fromHash) { const pos = store.get('position'); if (pos && S.bookByNo[Math.floor(pos / 1e6)]) target = pos; }
  let p = split(target);
  if (!hasChapter(p.book, p.chapter)) { target = 43003016; p = split(target); }
  fit();
  const ok = await navigate({ bookNo: p.book, chapter: p.chapter, vid: target, kind: 'open' });
  if (!ok) reader.innerHTML = '<div class="loading"><p>No chapter text is available in this preview.</p></div>';
}
window.asb = { state: S, parseRef, navigate, expandChip, snippetOf, labelOf, refOf, buildBundle, openPeek, goBack, goForward, verseOf, setFilter, setMotion };
boot();
</script>
