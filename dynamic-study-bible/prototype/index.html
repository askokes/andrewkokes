<!doctype html>
<html lang="en">
<head>

<title>Dynamic Study Bible</title>
<style>
:root {
  --page: #d8dad6; --page-2: #eceeea; --bezel: #101114; --bezel-edge: #3b3d43;
  --bg: #f4f4f1; --surface: #ffffff; --surface-2: #f9f9f7;

  --rule: #e2e3df; --rule-2: #cfd1cc;

  --cross: #157a72; --cross-soft: #dff1ee;
  --strong: #d39a12; --solid: #6f9a3e; --light: #a9afb6;
  --quote: #9b2c4f; --quote-soft: #f7e4ea;
  --story: #6a4bb0; --story-soft: #ece7f8;
  --topic: #4f5d6d; --topic-soft: #e8ebee;
  --seg: #e7e8e4; --seg-on: #ffffff;
  --hl: #fbefb8; --scrim: rgba(20,24,30,.38); --shadow: 0 -8px 30px rgba(20,24,30,.14);
  --json-key: #23517f; --json-str: #157a72; --json-num: #a05a00; --json-bool: #6a4bb0;
  --mk-yellow: #ffe27a; --mk-green: #b8e6a0; --mk-blue: #a9d3f5; --mk-pink: #f6b8d1; --mk-orange: #ffc98a;
  --bm: #c2413b; --danger: #b3261e; --bar-shadow: 0 8px 28px rgba(20,24,30,.18);
  --serif: Literata, "Iowan Old Style", "Palatino Linotype", Charter, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;

  --focus-y: 180px; --reader-h: 520px; --scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #050608; --page-2: #111318; --bezel: #22242a; --bezel-edge: #3a3d45;
    --bg: #0f1216; --surface: #171b21; --surface-2: #12161b;
    --ink: #ebe9e3; --ink-soft: #d3d1cb; --ink-2: #a3a9b3; --ink-3: #6f7681;
    --rule: #262b33; --rule-2: #3a404a;
    --accent: #8ab8e8; --accent-ink: #0b1a2a; --accent-soft: #1b2b3d;
    --cross: #4fcdbf; --cross-soft: #123430;
    --strong: #f0b730; --solid: #9ccf5c; --light: #6b7280;
    --quote: #f291ad; --quote-soft: #3b1b27;
    --story: #bba6f5; --story-soft: #2a2444;
    --topic: #b3bdc8; --topic-soft: #252b33;
    --seg: #1d2229; --seg-on: #353b45;
    --hl: #4a3d12; --scrim: rgba(0,0,0,.55); --shadow: 0 -8px 30px rgba(0,0,0,.5);
    --json-key: #8ab8e8; --json-str: #4fcdbf; --json-num: #f0b730; --json-bool: #bba6f5;
    --mk-yellow: rgba(255,226,122,.3); --mk-green: rgba(184,230,160,.26); --mk-blue: rgba(169,211,245,.28); --mk-pink: rgba(246,184,209,.28); --mk-orange: rgba(255,201,138,.28);
    --bm: #f28b82; --danger: #f2b8b5; --bar-shadow: 0 8px 28px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #050608; --page-2: #111318; --bezel: #22242a; --bezel-edge: #3a3d45;
  --bg: #0f1216; --surface: #171b21; --surface-2: #12161b;
  --ink: #ebe9e3; --ink-soft: #d3d1cb; --ink-2: #a3a9b3; --ink-3: #6f7681;
  --rule: #262b33; --rule-2: #3a404a;
  --accent: #8ab8e8; --accent-ink: #0b1a2a; --accent-soft: #1b2b3d;
  --cross: #4fcdbf; --cross-soft: #123430;
  --strong: #f0b730; --solid: #9ccf5c; --light: #6b7280;
  --quote: #f291ad; --quote-soft: #3b1b27;
  --story: #bba6f5; --story-soft: #2a2444;
  --topic: #b3bdc8; --topic-soft: #252b33;
  --seg: #1d2229; --seg-on: #353b45;
  --hl: #4a3d12; --scrim: rgba(0,0,0,.55); --shadow: 0 -8px 30px rgba(0,0,0,.5);
  --json-key: #8ab8e8; --json-str: #4fcdbf; --json-num: #f0b730; --json-bool: #bba6f5;
  --mk-yellow: rgba(255,226,122,.3); --mk-green: rgba(184,230,160,.26); --mk-blue: rgba(169,211,245,.28); --mk-pink: rgba(246,184,209,.28); --mk-orange: rgba(255,201,138,.28);
  --bm: #f28b82; --danger: #f2b8b5; --bar-shadow: 0 8px 28px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--sans); overflow-x: hidden; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.stage { min-height: 100%; height: 100%; display: grid; place-items: center; padding: 20px; background: radial-gradient(120% 90% at 50% 0%, var(--page-2), var(--page) 70%); overflow: hidden; }
.phone { position: relative; width: 393px; height: 852px; flex: none; border-radius: 54px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; transform: scale(var(--scale)); transform-origin: center; box-shadow: 0 0 0 11px var(--bezel), 0 0 0 13px var(--bezel-edge), 0 30px 70px rgba(0,0,0,.38); }
.island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000; z-index: 40; }
.statusbar { height: 54px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 34px 8px 40px; font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
.statusbar .icons { display: flex; align-items: center; gap: 6px; }
.statusbar svg { display: block; }
.topbar { position: relative; flex: none; display: flex; align-items: center; gap: 4px; padding: 2px 12px 6px; }
.tb-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--accent); font-size: 15px; font-weight: 600; flex: none; }
.tb-btn:active { background: var(--accent-soft); }
.tb-btn svg { width: 22px; height: 22px; }
.title { flex: 1; min-width: 0; height: 44px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; }
.title .t-main { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; font-size: 17px; font-weight: 600; letter-spacing: -.2px; line-height: 21px; white-space: nowrap; }
.title .t-main span { overflow: hidden; text-overflow: ellipsis; }
.title svg { width: 14px; height: 14px; color: var(--ink-3); flex: none; }
.t-tag { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; line-height: 14px; color: var(--ink-3); border: 1px solid var(--rule-2); border-radius: 5px; padding: 0 5px; }
.searchrow { position: absolute; inset: 2px 12px 6px; display: flex; gap: 8px; align-items: center; background: var(--bg); }
.searchrow input { flex: 1; min-width: 0; height: 40px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); padding: 0 14px; font-size: 16px; -webkit-appearance: none; }
.searchrow input::placeholder { color: var(--ink-3); }
.searchrow .cancel { color: var(--accent); font-size: 16px; padding: 0 4px; }
.reader { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overflow-anchor: none; padding: 0 20px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.reader::-webkit-scrollbar { width: 0; }
.chapter-head { min-height: calc(var(--focus-y) - 10px); display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 14px; }
.chapter-head .book { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.chapter-head .num-big { font-family: var(--serif); font-size: 44px; line-height: 1; font-weight: 500; letter-spacing: -.5px; margin-top: 4px; color: var(--ink); }
.v { position: relative; font-family: var(--serif); font-optical-sizing: auto; font-size: 18px; line-height: 1.62; color: var(--ink-soft); margin: 0 0 8px -12px; padding: 3px 0 3px 10px; border-left: 2px solid transparent; border-radius: 2px; transition: color .25s, border-color .25s, background-color .5s; -webkit-tap-highlight-color: transparent; }
.v.para { margin-top: 6px; }
.v.focus { color: var(--ink); border-left-color: var(--accent); }
.v.focus .vn { color: var(--accent); }
.v.hl { background: var(--hl); }
.vn { font-family: var(--sans); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; color: var(--ink-3); vertical-align: super; line-height: 0; margin-right: 5px; transition: color .25s; }
.v.omitted .vn { color: var(--rule-2); }
.tag { display: inline-block; font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 6px; vertical-align: middle; }
.chapter-foot { display: flex; justify-content: space-between; gap: 12px; padding: 18px 0 calc(var(--reader-h) * .66); }
.nav-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--rule); font-size: 14px; font-weight: 600; color: var(--accent); }
.nav-btn svg { width: 14px; height: 14px; }
.loading { padding: 40px 0; color: var(--ink-3); font-size: 14px; }
.loading .bar { height: 12px; border-radius: 6px; background: var(--rule); margin: 14px 0; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.strip { flex: none; border-top: 1px solid var(--rule); background: var(--surface-2); padding: 7px 0 8px; }
.strip-meta { display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 20px; font-size: 11.5px; color: var(--ink-3); }
.strip-controls { display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 32px; }
.m-label { flex: none; font-size: 12px; font-weight: 600; color: var(--ink-2); }
#matchValue { flex: none; min-width: 36px; font-size: 12px; font-weight: 700; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.strip-controls .switch { margin-left: 8px; padding-left: 10px; border-left: 1px solid var(--rule); }
#matchSlider { --p: 0; flex: 1; min-width: 0; height: 32px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: pan-x; }
#matchSlider:focus-visible { outline: none; }
#matchSlider::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) calc(12px + (100% - 24px) * var(--p)), var(--rule-2) 0); }
#matchSlider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 2px 5px rgba(0,0,0,.25); }
#matchSlider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent), 0 2px 5px rgba(0,0,0,.25); }
#matchSlider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--rule-2); }
#matchSlider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
#matchSlider::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 2px 5px rgba(0,0,0,.25); }
#matchSlider:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--accent), 0 2px 5px rgba(0,0,0,.25); }
.strip-meta .meta-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip-meta .meta-text b { color: var(--ink-2); font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); flex: none; }
.switch .knob { position: relative; width: 30px; height: 18px; border-radius: 9px; background: var(--rule-2); transition: background .2s; }
.switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.switch[aria-checked="true"] .knob { background: var(--accent); }
.switch[aria-checked="true"] .knob::after { transform: translateX(12px); }
.filters { display: flex; gap: 2px; margin: 2px 16px 0; padding: 2px; border-radius: 9px; background: var(--seg); }
.filters button { flex: 1; min-width: 0; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.filters button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.filters .n { font-weight: 500; color: var(--ink-3); }
.filters .zero { opacity: .6; }
.kdot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.kdot.quote { background: var(--quote); } .kdot.story { background: var(--story); } .kdot.topic { background: var(--topic); }
.marquee { position: relative; height: 62px; margin-top: 7px; overflow: hidden; transition: opacity .14s; -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
.marquee.fading { opacity: 0; }
.marquee.hold { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.marquee.hold::-webkit-scrollbar { display: none; }
.marquee.dragging { scroll-snap-type: none; cursor: grabbing; }
.marquee.dragging .chip { pointer-events: none; }
.track { display: flex; gap: 8px; padding: 0 16px; width: max-content; will-change: transform; }
.marquee.hold .track { transform: none !important; }
.chip { position: relative; display: inline-flex; flex-direction: column; gap: 4px; flex: none; text-align: left; min-width: 260px; max-width: 336px; padding: 8px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--rule); color: var(--ink); scroll-snap-align: start; box-shadow: 0 1px 2px rgba(20,24,30,.05); user-select: none; -webkit-user-select: none; }
.chip .top { display: flex; align-items: center; gap: 6px; font-size: 13.5px; line-height: 20px; white-space: nowrap; min-width: 0; }
.chip .dir { color: var(--accent); font-size: 15px; width: 14px; text-align: center; flex: none; }
.chip.cross { border-color: var(--cross-soft); }
.chip.cross .dir, .chip.cross .lbl { color: var(--cross); }
.chip .lbl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.chip .rpill { margin-left: auto; }
.chip .because { font-size: 12.5px; line-height: 16px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .snip { width: 0; min-width: 100%; font-family: var(--serif); font-size: 13px; line-height: 18px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .snip.none { font-family: var(--sans); font-size: 12px; color: var(--ink-3); }
.dot.strong { background: var(--strong); } .dot.solid { background: var(--solid); } .dot.light { background: var(--light); }
.rpill { display: inline-flex; align-items: center; flex: none; height: 18px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .02em; line-height: 1; }
.rpill.quote { color: var(--quote); background: var(--quote-soft); }
.rpill.story { color: var(--story); background: var(--story-soft); }
.rpill.topic { color: var(--topic); background: var(--topic-soft); }
.rpill.lg { height: 26px; padding: 0 11px; font-size: 13px; }
.rpill .pct { font-variant-numeric: tabular-nums; }
.rpill .pct::before { content: "\00b7"; margin: 0 4px; opacity: .6; }
.empty { display: flex; align-items: center; height: 58px; padding: 0 2px; color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.trailbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-top: 1px solid var(--rule); background: var(--surface-2); }
.crumbs { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 13px; scrollbar-width: none; padding: 6px 4px; }
.crumbs::-webkit-scrollbar { display: none; }
.crumb { color: var(--ink-2); padding: 2px 4px; border-radius: 6px; }
.crumb.cur { color: var(--ink); font-weight: 600; background: var(--surface); border: 1px solid var(--rule); }
.crumb.fwd { opacity: .45; }
.crumbs .arrow { color: var(--ink-3); margin: 0 2px; }
.tr-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--accent); flex: none; }
.tr-btn:disabled { color: var(--rule-2); cursor: default; }
.tr-btn svg { width: 20px; height: 20px; }
.tr-btn.web { width: auto; padding: 0 10px; gap: 5px; font-size: 13px; font-weight: 600; }
.tr-btn.web svg { width: 16px; height: 16px; }
.home { flex: none; height: 30px; display: grid; place-items: center; }
.home::after { content: ""; width: 134px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 50; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow); transform: translateY(105%); transition: transform .34s cubic-bezier(.2,.8,.2,1); z-index: 60; visibility: hidden; }
.sheet.on { transform: none; visibility: visible; }
.sheet.tall { height: 88%; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--rule-2); margin: 8px auto 2px; flex: none; }
.s-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 20px; flex: none; }
.s-head h2 { flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-head h2 .dir { font-weight: 600; margin-right: 2px; }
.s-head .sub { font-size: 12px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; display: block; margin-top: 2px; }
.x-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--bg); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.x-btn svg { width: 14px; height: 14px; }
.s-body { overflow-y: auto; min-height: 0; padding: 4px 20px calc(24px + env(safe-area-inset-bottom, 0px)); font-size: 15px; line-height: 1.5; }
.s-body p { margin: 0 0 10px; }
.s-body.has-foot { padding-bottom: 8px; }
.s-foot { flex: none; padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); }
.reason-line { margin: 2px 0 14px; }
.reason-line .because-lg { display: block; margin-top: 8px; font-size: 17px; line-height: 1.35; font-weight: 600; color: var(--ink); letter-spacing: -.1px; }
.passage { font-family: var(--serif); font-size: 17px; line-height: 1.62; color: var(--ink); margin: 0 0 4px; }
.passage .vn { vertical-align: super; }
.caption { font-size: 11.5px; color: var(--ink-3); margin: 0 0 14px !important; }
.votes-list { list-style: none; margin: 0 0 10px; padding: 0; border-top: 1px solid var(--rule); }
.votes-list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink-2); }
.votes-list b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.via { font-size: 13px; color: var(--ink-2); }
.fine { font-size: 12px; color: var(--ink-3); margin: 0 0 14px; }
.actions { display: flex; gap: 10px; }
.btn { flex: 1; height: 46px; border-radius: 14px; font-size: 16px; font-weight: 600; background: var(--bg); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.sq { flex: none; width: 46px; font-family: var(--mono); font-size: 15px; }
.btn:active { filter: brightness(.94); }
.list .chip { max-width: none; width: 100%; margin-bottom: 8px; }
.list .chip .rank { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12px; width: 18px; flex: none; }
.list .chip .because { white-space: normal; padding-left: 44px; }
.note { font-size: 13px; color: var(--ink-3); text-align: center; padding: 10px 0 4px; }
.seg { display: flex; gap: 6px; margin: 4px 0 12px; }
.seg button { flex: 1; height: 34px; border-radius: 10px; background: var(--bg); font-size: 13px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

<script>

/* Every piece of runtime state lives here. */
const S = {
  dataRoot: (params.get('data') || './data').replace(/\/+$/, ''),

  motion: { defaultMode: 'hold', baseSeconds: 3.0, perWeightSeconds: 3.0 }, motionOn: false, prefersReduced: false, filter: 'all', match: 0, matchSlider: { min: 0, max: 100, step: 5, default: 0 }, listItems: [],
  ticker: { all: [], items: [], x: 0, seqW: 0, widths: [], cum: [], dwell: [], raf: 0, lastT: 0, gen: 0, holdPointer: false, drag: null, suppressClick: false, wheelAt: 0 },
  trail: null, peekItem: null, peekFocus: null, sheet: null, pickerBook: 0, jsonMode: null,
  ann: null, annSeed: null, annIdx: new Map(), sel: null, editing: null, draftTags: [], draftNames: {}, study: { tab: 'highlights', tag: null, confirm: false }

  get(k) { try { return JSON.parse(localStorage.getItem('asb.' + k)); } catch (e) { return null; } },

/* ---------- ids, refs, labels, snippets (derivations match the pipeline) ---------- */

    rank, to: { start, end, ref: refOf(start, end), label: labelOf(start, end) }, direction: DIR[dir], votesOut, votesIn, score, weight,

/* ---------- data loading ---------- */
async function fetchJson(path, optional) {
  const url = `${S.dataRoot}/${path}`;
  try { const r = await fetch(url); if (!r.ok) throw new Error(`HTTP ${r.status}`); return await r.json(); }
  catch (e) { S.missing.push(url); if (optional) return null; throw new Error(`${url}: ${e.message}`); }
}
async function loadXref(bookNo) {
  if (S.xref[bookNo]) return S.xref[bookNo];
  const b = S.bookByNo[bookNo];
  const x = await fetchJson(`xref/${pad2(bookNo)}-${b.osis}.json`, true);
  if (!x) console.warn(`No cross reference shard for ${b.name}; the strip will be empty for this book.`);
  if (x && x.legend) { if (Array.isArray(x.legend.reasonKinds)) S.legend.reasonKinds = x.legend.reasonKinds; if (Array.isArray(x.legend.reasonBases)) S.legend.reasonBases = x.legend.reasonBases; }

}
function attribution() {
  const m = S.manifest, src = (m && m.sources) || [];
  const by = kind => (src.find(s => s.kind === kind) || {}).attribution;
  return {
    text: by('text') || 'Berean Standard Bible, public domain',
    crossReferences: by('crossReferences') || 'Cross references from OpenBible.info, CC-BY (2016-02-01)',
    ai: by('ai') || "Study notes marked 'why' are AI-generated (see manifest.sources.ai)"

}
function neighbourChapter(bookNo, chapter, dir) {

}

  pool.forEach(it => { const p = pctOf(it.reason); if (p !== null) b[Math.min(19, Math.floor(p / 5))]++; });
  return b;
}
async function buildBundle(bookNo, chapter) {

  const book = S.bookByNo[bookNo], x = await loadXref(bookNo);
  const texts = S.text.books[bookNo - 1][chapter - 1], xch = x.chapters[chapter - 1] || [];
  const tickerInline = (S.manifest && S.manifest.ranking && S.manifest.ranking.tickerInline) || 12;

/* ---------- reference search ---------- */
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
function findBook(s) {
  const k = norm(s); if (!k) return null;
  if (S.bookKeys.has(k)) return S.bookByNo[S.bookKeys.get(k)];
  return S.books.find(b => norm(b.name).startsWith(k)) || S.books.find(b => (b.aliases || []).some(a => norm(a).startsWith(k))) || null;
}
function parseRef(q) {
  const m = String(q || '').trim().replace(/\./g, ' ').match(/^(\d?\s*[a-z][a-z ]*?)\s*(\d+)(?:\s*[:\s]\s*(\d+))?$/i);

/* ---------- trail (spec 4.3 shape) ---------- */
function newTrail() {

    schema: 'asb.trail/2', id: `trail_${nowIso()}_${Math.random().toString(16).slice(2, 6)}`, translation: 'bsb', cursor: -1, hops: [], forward: [], peeks: [], peek: null,

function hopFor(kind, vid, via, highlight) {

  T.web.loopClosed = T.web.edges.concat(T.web.peekOnlyEdges).some(e => nodes.indexOf(e[1]) >= 0 && nodes.indexOf(e[1]) < nodes.indexOf(e[0]));

/* ---------- rendering the reader ---------- */
function verseOf(vid) { return S.bundle && S.bundle.chapterId === vid - (vid % 1000) ? S.bundle.verses[(vid % 1000) - 1] : null; }

  }
  html += `<div class="chapter-foot">${prev ? `<button class="nav-btn" data-chapter="${prev}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>${esc(nav(prev))}</button>` : '<span></span>'}${next ? `<button class="nav-btn" data-chapter="${next}">${esc(nav(next))}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>` : '<span></span>'}</div>`;
  reader.innerHTML = html;
  S.focusVid = 0;
}
const focusY = () => reader.clientHeight / 3;
function scrollToVerse(vid) {
  const el = reader.querySelector(`.v[data-vid="${vid}"]`); if (!el) return;

  reader.scrollTop = Math.max(0, el.offsetTop - focusY() + 2);
}
function verseAtFocusLine() {
  const y = reader.getBoundingClientRect().top + focusY();

    const r = el.getBoundingClientRect();
    if (r.top <= y && r.bottom > y) return +el.dataset.vid;

}
function setFocus(vid, opts = {}) {

  const el = reader.querySelector(`.v[data-vid="${vid}"]`); if (el) el.classList.add('focus');

/* ---------- navigation ---------- */
async function navigate({ bookNo, chapter, vid, kind = null, via = null, highlight = null }) {
  const book = S.bookByNo[bookNo]; if (!book) return false;
  if (!hasChapter(bookNo, chapter)) { toast(`${book.name} ${chapter} is not available in this preview`); return false; }
  let bundle;
  try { bundle = await buildBundle(bookNo, chapter); }
  catch (e) { console.warn(e); toast(`${book.name} ${chapter} could not be loaded`); return false; }
  if (kind) pushHop(kind, vid, via, highlight);
  closeBar();
  if (bundle !== S.bundle) renderChapter(bundle);

}
async function restoreHop(hop) {
  const p = split(hop.scroll.chapter);

  const bundle = await buildBundle(p.book, p.chapter);

  if (bundle !== S.bundle) renderChapter(bundle);

async function goToHop(i) {

/* tag field, shared by the note and tag sheets (one is open at a time) */

    $('#studyTitle').innerHTML = `${esc(tagName(drill))}<span class="sub"><span class="num">${groups.length}</span> verse${groups.length === 1 ? '' : 's'} with this tag</span>`;
    body = groups.map(g => rowHtml(g[0], g)).join('');
  } else {
    $('#studyTitle').innerHTML = `My Study<span class="sub"><span class="num">${items.length}</span> mark${items.length === 1 ? '' : 's'} saved in this browser</span>`;
    if (st.tab === 'tags') {
      body = S.ann.tags.map(t => ({ t, n: tagGroups(t.id).length })).sort((a, b) => b.n - a.n || a.t.name.localeCompare(b.t.name))
        .map(({ t, n }) => `<button class="mrow tagrow" data-tag="${esc(t.id)}" aria-label="${esc(`Tag ${t.name}, ${n} verse${n === 1 ? '' : 's'}`)}"><span class="m-ico">#</span><span class="m-main"><span class="m-top"><span>${esc(t.name)}</span><span class="m-count num">${n}</span></span></span><span class="m-chev">${ICON.chev}</span></button>`).join('');
    } else body = items.filter(it => it.kind === STUDY_TABS[st.tab].kind).sort(newestFirst).map(it => rowHtml(it)).join('');
    if (!body) body = `<p class="note" id="studyEmpty">${esc(STUDY_TABS[st.tab].empty)}</p>`;
  }
  const foot = st.confirm
    ? `<p class="fine">Remove all <span class="num">${items.length}</span> mark${items.length === 1 ? '' : 's'} and every tag? This cannot be undone.</p><div class="actions"><button class="btn" data-study="cancel">Cancel</button><button class="btn danger-fill" data-study="clearYes">Clear all</button></div>`
    : `<div class="actions"><button class="btn" data-study="json">View JSON</button></div><div class="actions"><button class="btn" data-study="restore">Restore examples</button><button class="btn danger" data-study="clear"${items.length ? '' : ' disabled'}>Clear all my marks</button></div>`;
  $('#studyBody').innerHTML = `<div id="studyList">${body}</div><div class="study-foot" id="studyFoot">${foot}</div>`;
}
async function jumpToMark(it) {
  const a = it.anchor, p = split(a.start.vid);
  const ok = await navigate({ bookNo: p.book, chapter: p.chapter, vid: a.start.vid, kind: it.kind === 'bookmark' ? 'bookmarkOpen' : 'open', highlight: { start: a.start.vid, end: a.end.vid } });
  if (ok) closeSheet();
}
async function restoreExamples() {
  const seed = validAnn(S.annSeed) ? S.annSeed : await fetchJson('annotations.json', true);
  if (!validAnn(seed)) { toast('The examples could not be loaded'); return; }
  S.annSeed = seed;
  const have = new Set(S.ann.items.map(it => it.id));
  cloneJson(seed.items).forEach(it => { if (!have.has(it.id)) S.ann.items.push(it); });
  cloneJson(seed.tags).forEach(t => { if (!S.ann.tags.some(x => x.id === t.id)) S.ann.tags.push(t); });
  S.study.confirm = false; afterChange(); toast('Examples restored');
}
function clearAllMarks() {
  S.ann.items = []; S.ann.tags = []; S.study = { tab: S.study.tab, tag: null, confirm: false };
  afterChange(); toast('All your marks are cleared');
}
// The peek's "Your notes" line: highlight colours, tags and the first line of a note on the peeked verse.
function mineHtml(start, end) {
  if (!S.ann) return '';
  const items = marksIn(start, end).filter(it => it.kind !== 'bookmark'); if (!items.length) return '';
  const colors = [], tags = [], note = items.filter(it => it.kind === 'note').sort(newestFirst)[0];
  items.forEach(it => { if (it.kind === 'highlight' && !colors.includes(it.color)) colors.push(it.color); (it.tags || []).forEach(t => { if (!tags.includes(t)) tags.push(t); }); });
  return `<p class="mine-line" id="peekMine"><span class="ml-k">Your notes</span>${colors.map(c => `<i class="cdot" style="--mk:${solidHex(c)}" role="img" aria-label="${esc(colorLabel(c))} highlight"></i>`).join('')}` +
    (tags.length ? `<span class="ml-tags">${tags.map(t => esc(tagName(t))).join(' · ')}</span>` : '') + (note ? `<span class="ml-note">${esc(firstLine(note.body))}</span>` : '') + '</p>';
}

/* ---------- trail web overlay ---------- */
function renderWeb() {
  const T = S.trail, nodes = T.web.nodes.slice();
  T.web.peekOnlyEdges.forEach(e => { if (!nodes.includes(e[1])) nodes.push(e[1]); });
  const W = 393, H = 420, cx = W / 2, cy = H / 2 - 6, r = nodes.length > 1 ? 128 : 0, pos = {};
  nodes.forEach((v, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / nodes.length; pos[v] = [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
  const cur = currentHop() ? currentHop().vid : 0, maxV = Math.max(1, ...T.web.edges.map(e => e[2] || 1));
  let s = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="var(--accent)"/></marker></defs>';
  const line = (a, b, w, dashed) => { const [x1, y1] = pos[a], [x2, y2] = pos[b], dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1, k = 16 / d; return `<line x1="${x1 + dx * k}" y1="${y1 + dy * k}" x2="${x2 - dx * k}" y2="${y2 - dy * k}" stroke="${dashed ? 'var(--ink-3)' : 'var(--accent)'}" stroke-width="${w}" stroke-linecap="round" ${dashed ? 'stroke-dasharray="5 6"' : 'marker-end="url(#arrow)"'} opacity="${dashed ? .8 : .9}"/>`; };
  T.web.edges.forEach(e => { if (pos[e[0]] && pos[e[1]]) s += line(e[0], e[1], (1.2 + 4.5 * Math.sqrt((e[2] || 1) / maxV)).toFixed(2), false); });
  T.web.peekOnlyEdges.forEach(e => { if (pos[e[0]] && pos[e[1]]) s += line(e[0], e[1], 1.4, true); });
  nodes.forEach(v => {
    const [x, y] = pos[v], visited = T.web.nodes.includes(v), isCur = v === cur, lbl = labelOf(v, v);
    const half = lbl.length * 3.8, lx = Math.min(W - 10 - half, Math.max(10 + half, x)), ly = y < cy - 1 ? y - 21 : y + 31;
    s += `<circle cx="${x}" cy="${y}" r="${isCur ? 13 : 11}" fill="${visited ? (isCur ? 'var(--accent)' : 'var(--surface)') : 'var(--bg)'}" stroke="${visited ? 'var(--accent)' : 'var(--ink-3)'}" stroke-width="${isCur ? 3 : 2}" ${visited ? '' : 'stroke-dasharray="3 3"'}/>`;
    s += `<text x="${lx.toFixed(1)}" y="${ly}" text-anchor="middle" font-size="13" font-weight="${isCur ? 700 : 500}" fill="var(--ink)" font-family="var(--sans)">${esc(lbl)}</text>`;
  });
  if (!nodes.length) s += `<text x="${cx}" y="${cy}" text-anchor="middle" fill="var(--ink-3)" font-size="14">Nothing visited yet</text>`;
  $('#webSvg').innerHTML = s;
  const hops = T.hops.length + T.forward.length;
  $('#webSub').innerHTML = `<span class="num">${hops}</span> hop${hops === 1 ? '' : 's'} \u00b7 ${T.web.nodes.length} verse${T.web.nodes.length === 1 ? '' : 's'} \u00b7 ${T.web.booksTouched.length} book${T.web.booksTouched.length === 1 ? '' : 's'}${T.web.loopClosed ? ' \u00b7 loop closed' : ''} \u00b7 ${T.peeks.length} peek${T.peeks.length === 1 ? '' : 's'}`;
}
function openWeb() { renderWeb(); $('#webOverlay').classList.add('on'); }
function closeWeb() { $('#webOverlay').classList.remove('on'); }

/* ---------- toast, search, layout ---------- */
let toastTimer = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); }
function showSearch(on) { const row = $('#searchRow'); row.hidden = !on; if (on) { const i = $('#searchInput'); i.value = ''; i.focus(); } }
async function runSearch(q) {
  const r = parseRef(q);
  if (!r) { toast(`Could not read "${q}". Try Rom 5:8 or John 3.`); return false; }
  showSearch(false);
  return navigate({ bookNo: r.bookNo, chapter: r.chapter, vid: vidOf(r.bookNo, r.chapter, r.verse || 1), kind: 'search' });
}
function fit() {
  const phone = $('#phone');
  if (innerWidth <= 500) phone.style.removeProperty('--scale');
  else phone.style.setProperty('--scale', Math.min(1, (innerHeight - 44) / 880, (innerWidth - 44) / 420).toFixed(3));
  phone.style.setProperty('--focus-y', `${Math.round(reader.clientHeight / 3)}px`);
  phone.style.setProperty('--reader-h', `${reader.clientHeight}px`);
  placeBar();
}

/* ---------- events ---------- */
reader.addEventListener('scroll', () => { if (!S.scrollRaf) S.scrollRaf = requestAnimationFrame(onScroll); }, { passive: true });
reader.addEventListener('click', e => {
  const nav = e.target.closest('.nav-btn'); if (nav) { const p = split(+nav.dataset.chapter); navigate({ bookNo: p.book, chapter: p.chapter, vid: vidOf(p.book, p.chapter, 1), kind: 'open' }); return; }
  const nb = e.target.closest('.v-note'); if (nb) { const it = findItem(nb.dataset.note); if (it) openNote(it); return; }
  const tg = e.target.closest('.v-tag'); if (tg) { openStudy('tags', tg.dataset.tag); return; }
  const v = e.target.closest('.v'); if (!v) return;
  const vid = +v.dataset.vid;
  // In part-of-verse mode a tap on a word of the selected verse picks the first, then the last word.
  if (S.sel && S.sel.vid === vid && S.sel.part) { const w = e.target.closest('.w'); if (w) pickWord(+w.dataset.w); return; }
  setFocus(vid, { pin: true, force: true });
  if (S.sel && S.sel.vid === vid) closeBar(); else openBar(vid);
});
track.addEventListener('click', e => { if (S.ticker.suppressClick) return; const c = e.target.closest('.chip'); if (c) openPeek(S.ticker.items.find(it => it.rank === +c.dataset.rank)); });
$('#listBody').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) openPeek(S.listItems.find(it => it.rank === +c.dataset.rank)); });
marquee.addEventListener('pointerdown', e => {
  S.ticker.holdPointer = true;
  if (e.pointerType === 'mouse' && marquee.classList.contains('hold')) S.ticker.drag = { x: e.clientX, left: marquee.scrollLeft, moved: false };
});
addEventListener('pointermove', e => {
  const d = S.ticker.drag; if (!d) return;
  const dx = e.clientX - d.x;
  if (!d.moved && Math.abs(dx) > 5) { d.moved = true; marquee.classList.add('dragging'); }
  if (d.moved) marquee.scrollLeft = d.left - dx;
});
addEventListener('pointerup', () => {
  const d = S.ticker.drag; S.ticker.drag = null; S.ticker.holdPointer = false;
  if (d && d.moved) { marquee.classList.remove('dragging'); S.ticker.suppressClick = true; setTimeout(() => { S.ticker.suppressClick = false; }, 0); }
});
['pointercancel', 'pointerleave'].forEach(t => marquee.addEventListener(t, () => { if (!S.ticker.drag) S.ticker.holdPointer = false; }));
marquee.addEventListener('wheel', e => {
  if (!marquee.classList.contains('hold') || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  e.preventDefault();
  const now = performance.now(); if (now - S.ticker.wheelAt < 280) return;
  S.ticker.wheelAt = now; stepChips(Math.sign(e.deltaY));
}, { passive: false });
$('#filters').addEventListener('click', e => { const b = e.target.closest('button[data-filter]'); if (b) setFilter(b.dataset.filter); });
$('#motionToggle').addEventListener('click', () => setMotion(!S.motionOn, true));
$('#matchSlider').addEventListener('input', e => setMatch(e.target.value, false));
$('#matchSlider').addEventListener('change', e => setMatch(e.target.value, true));
$('#backBtn').addEventListener('click', goBack);
$('#fwdBtn').addEventListener('click', goForward);
$('#crumbs').addEventListener('click', e => { const c = e.target.closest('.crumb'); if (c) goToHop(+c.dataset.hop); });
$('#webBtn').addEventListener('click', openWeb);
$('#webClose').addEventListener('click', closeWeb);
$('#copyTrail').addEventListener('click', () => copyText(JSON.stringify(S.trail, null, 2)));
$('#viewTrail').addEventListener('click', () => openJson('Trail JSON', S.trail, 'trail'));
$('#jsonCopy').addEventListener('click', () => copyText($('#jsonTa').value));
$('#jsonBtn').addEventListener('click', () => { const v = verseOf(S.focusVid); if (v) openJson(`${v.label} \u00b7 verse JSON`, v, 'verse'); });
$('#peekGo').addEventListener('click', () => { if (S.peekItem) goToChip(S.peekItem); });
$('#peekAll').addEventListener('click', () => { if (S.peekFocus) openList(S.peekFocus); });
$('#peekJson').addEventListener('click', () => { if (S.peekFocus) openJson(`${S.peekFocus.label} \u00b7 verse JSON`, S.peekFocus, 'verse'); });
$('#aboutBtn').addEventListener('click', openAbout);
$('#studyBtn').addEventListener('click', () => openStudy());
$('#abClose').addEventListener('click', closeBar);
$('#abSwatches').addEventListener('click', e => { const b = e.target.closest('.sw'); if (b && !b.disabled) applyColor(b.dataset.color); });
$('#abClear').addEventListener('click', clearHighlight);
$('#abBookmark').addEventListener('click', toggleBookmark);
$('#abNote').addEventListener('click', () => { const a = barAnchor(); if (!a) return; openNote(S.ann.items.find(it => it.kind === 'note' && anchorKey(it.anchor) === anchorKey(a)) || null, a); });
$('#abTag').addEventListener('click', () => openTagSheet(barAnchor()));
$('#abPart').addEventListener('click', togglePart);
$('#noteText').addEventListener('input', syncNoteSave);
$('#noteSave').addEventListener('click', saveNote);
$('#noteDelete').addEventListener('click', deleteNote);
$('#tagsSave').addEventListener('click', saveTags);
wireTagField('note'); wireTagField('tags');
$('#studyTabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; S.study = { tab: b.dataset.tab, tag: null, confirm: false }; renderStudy(); $('#studyBody').scrollTop = 0; });
$('#studyBack').addEventListener('click', () => { S.study.tag = null; renderStudy(); });
$('#studyBody').addEventListener('click', e => {
  const t = e.target.closest('[data-tag]'); if (t) { S.study.tag = t.dataset.tag; renderStudy(); $('#studyBody').scrollTop = 0; return; }
  const r = e.target.closest('[data-ann]'); if (r) { const it = findItem(r.dataset.ann); if (it) jumpToMark(it); return; }
  const a = e.target.closest('[data-study]'); if (!a) return;
  const act = a.dataset.study;
  if (act === 'json') openJson('My marks JSON', S.ann, 'annotations');
  else if (act === 'restore') restoreExamples();
  else if (act === 'clear') { S.study.confirm = true; renderStudy(); }
  else if (act === 'cancel') { S.study.confirm = false; renderStudy(); }
  else if (act === 'clearYes') clearAllMarks();
});
$('#titleBtn').addEventListener('click', () => openPicker(0));
$('#pickerBack').addEventListener('click', () => openPicker(0));
$('#pickerBody').addEventListener('click', async e => {
  const b = e.target.closest('[data-book]'); if (b) { openPicker(+b.dataset.book); return; }
  const c = e.target.closest('[data-ch]'); if (c) { const ok = await navigate({ bookNo: S.pickerBook, chapter: +c.dataset.ch, vid: vidOf(S.pickerBook, +c.dataset.ch, 1), kind: 'open' }); if (ok) closeSheet(); }
});
$('#searchBtn').addEventListener('click', () => showSearch(true));
$('#searchCancel').addEventListener('click', () => showSearch(false));
$('#searchRow').addEventListener('submit', e => { e.preventDefault(); runSearch($('#searchInput').value); });
$('#scrim').addEventListener('click', closeSheet);
$$('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.sheet) closeSheet(); else if ($('#webOverlay').classList.contains('on')) closeWeb(); else if (!$('#searchRow').hidden) showSearch(false); else if (S.sel) closeBar(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) S.ticker.lastT = 0; });
addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); if (S.focusVid) scrollToVerse(S.focusVid); });
const reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');
reducedQuery.addEventListener('change', e => { S.prefersReduced = e.matches; if (e.matches && S.motionOn) setMotion(false, false); });

/* ---------- boot ---------- */
async function boot() {
  applyTheme(store.get('theme'));
  S.prefersReduced = reducedQuery.matches;
  S.trail = newTrail(); fit();
  try {
    const [books, text, manifest, notes, annSeed] = await Promise.all([fetchJson('books.json'), fetchJson('text/bsb.json'), fetchJson('manifest.json', true), fetchJson('ai/notes.json', true), fetchJson('annotations.json', true)]);
    S.books = books.books; S.text = text; S.manifest = manifest; S.annSeed = annSeed;
    if (notes) S.notes = { edges: notes.edges || {}, verses: notes.verses || {} };
    S.books.forEach(b => { S.bookByNo[b.bookNo] = b; [b.name, b.short, b.osis, b.sourceName].concat(b.aliases || []).forEach(k => { if (k) S.bookKeys.set(norm(k), b.bookNo); }); });
    loadAnn(annSeed);
    const mo = manifest && manifest.ranking && manifest.ranking.motion;
    const f = !mo && manifest && manifest.ranking && String(manifest.ranking.dwellSeconds || '').match(/([\d.]+)\s*\+\s*([\d.]+)\s*\*\s*weight/);
    if (mo && isFinite(mo.baseSeconds) && isFinite(mo.perWeightSeconds)) S.motion = { defaultMode: mo.defaultMode || 'hold', baseSeconds: +mo.baseSeconds, perWeightSeconds: +mo.perWeightSeconds };
    else if (f) S.motion = { defaultMode: 'hold', baseSeconds: +f[1], perWeightSeconds: +f[2] };
    if (text.translation && text.translation.abbr) $('#previewTag').textContent = `${text.translation.abbr} preview`;
  } catch (e) {
    reader.innerHTML = `<div class="loading"><p>The Bible data could not be loaded.</p><p class="fine">${esc(e.message)}</p></div>`;
    console.warn(e); return;
  }
  const ms = S.manifest && S.manifest.ranking && S.manifest.ranking.matchSlider;
  if (ms) S.matchSlider = { min: isFinite(ms.min) ? +ms.min : 0, max: isFinite(ms.max) ? +ms.max : 100, step: isFinite(ms.step) && ms.step > 0 ? +ms.step : 5, default: isFinite(ms.default) ? +ms.default : 0 };
  const sl = $('#matchSlider'); sl.min = S.matchSlider.min; sl.max = S.matchSlider.max; sl.step = S.matchSlider.step;
  const savedMatch = store.get('match.v1');
  S.match = typeof savedMatch === 'number' && savedMatch >= S.matchSlider.min && savedMatch <= S.matchSlider.max ? savedMatch : S.matchSlider.default;
  renderSlider();
  const saved = store.get('motion.v2');
  S.motionOn = S.prefersReduced ? false : saved === null ? S.motion.defaultMode === 'autoScroll' : saved === true;
  $('#motionToggle').setAttribute('aria-checked', String(S.motionOn));
  const hash = decodeURIComponent(location.hash.slice(1)), fromHash = hash ? parseRef(hash) : null;
  let target = fromHash ? vidOf(fromHash.bookNo, fromHash.chapter, fromHash.verse || 1) : 43003016;
  if (!fromHash) { const pos = store.get('position'); if (pos && S.bookByNo[Math.floor(pos / 1e6)]) target = pos; }
  let p = split(target);
  if (!hasChapter(p.book, p.chapter)) { target = 43003016; p = split(target); }
  fit();
  const ok = await navigate({ bookNo: p.book, chapter: p.chapter, vid: target, kind: 'open' });
  if (!ok) reader.innerHTML = '<div class="loading"><p>No chapter text is available in this preview.</p></div>';
}
window.asb = { state: S, parseRef, navigate, expandChip, snippetOf, labelOf, refOf, buildBundle, openPeek, goBack, goForward, verseOf, setFilter, setMatch, poolOf, atOrAbove, setMotion, openStudy, openBar, closeBar, annotations: () => S.ann };
boot();
</script>
